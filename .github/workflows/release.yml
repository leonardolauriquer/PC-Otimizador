name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v5.5.1)'
        required: true
        default: 'v5.5.1'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine tests
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\Tests\Engine.Tests.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .\Tests\Static.Tests.ps1

  shell-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax and core JSON
        shell: bash
        run: |
          set -euo pipefail
          bash -n linux/pc-otimizador.sh
          bash -n macos/pc-otimizador.sh
          bash -n android/termux-pc-otimizador.sh
          python3 -m json.tool core/presets.json >/dev/null
          python3 -m py_compile core/load_preset.py

  build-zip:
    needs: [test, shell-smoke]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compile GUI
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /target:winexe /optimize+ /platform:anycpu `
            /reference:System.Windows.Forms.dll /reference:System.Drawing.dll `
            /win32manifest:app.manifest /out:PC-Otimizador.exe GuiNative.cs
          if ($LASTEXITCODE -ne 0) { throw 'csc failed' }

      - name: Pack release folder
        shell: pwsh
        run: |
          $out = 'PC-Otimizador-Release'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $must = @(
            'Executar.bat','Engine.ps1','PC-Otimizador-CLI.ps1','PC-Otimizador.exe',
            'Update.ps1','VERSION','LICENSE','README.md','core\presets.json'
          )
          foreach ($f in $must) {
            if (-not (Test-Path $f)) { throw "Missing required release file: $f" }
          }
          Copy-Item Executar.bat,Engine.ps1,PC-Otimizador-CLI.ps1,PC-Otimizador.ps1,PC-Otimizador.exe,Update.ps1,VERSION,LEIA-ME.txt,LICENSE,README.md $out
          foreach ($dir in 'linux','macos','android','ios','core') {
            if (Test-Path $dir) { Copy-Item -Recurse $dir "$out\$dir" }
          }
          if (-not (Test-Path "$out\Engine.ps1")) { throw 'Pack failed: Engine.ps1' }
          if (-not (Test-Path "$out\PC-Otimizador.exe")) { throw 'Pack failed: exe' }
          if (-not (Test-Path "$out\core\presets.json")) { throw 'Pack failed: presets' }
          Compress-Archive -Path "$out\*" -DestinationPath 'PC-Otimizador-Windows.zip' -Force
          Get-FileHash 'PC-Otimizador-Windows.zip' -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  PC-Otimizador-Windows.zip" } |
            Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: PC Otimizador Pro ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          body: |
            ## Trust notes
            - Builds only after Engine tests pass
            - `SHA256SUMS.txt` included — verify the ZIP hash
            - Executable is **not** Authenticode-signed (use `Executar.bat` if SmartScreen/AV complains)
          files: |
            PC-Otimizador-Windows.zip
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
